server:
  port: 8082

spring:
  application:
    name: qma-service

  datasource:
    url: jdbc:mysql://localhost:3306/quantity_service_db
    username: root
    password: hag11990
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

  # FIX: correct indentation — was broken (allow-bean-definition-overriding was outside spring.main)
  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  secret: QMASecretKey2024QMASecretKey2024QM

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
