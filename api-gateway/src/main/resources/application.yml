server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        # Auth routes — PUBLIC
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # QMA routes — PROTECTED
        - id: qma-service
          uri: lb://QMA-SERVICE
          predicates:
            - Path=/api/v1/**
          filters:
            - name: JwtAuthFilter

        # ✅ Swagger docs (FIX)
        - id: qma-swagger-docs
          uri: lb://QMA-SERVICE
          predicates:
            - Path=/v3/api-docs,/v3/api-docs/**
          filters:
            - StripPrefix=0

        # ✅ Swagger UI (FIX)
        - id: qma-swagger-ui
          uri: lb://QMA-SERVICE
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**
          filters:
            - StripPrefix=0

      default-filters:
        - PreserveHostHeader

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

jwt:
  secret: QMASecretKey2024QMASecretKey2024QM

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always